# @package _global_

defaults:
  - robot_base
  - _self_

robot:
  name: mini3
  num_dofs: 21
  num_bodies: 24
  dof_obs_size: 21
  actions_dim: 21
  lower_body_actions_dim: 12
  upper_body_actions_dim: 9
  strict_dof_groups: true
  body_keys: ["lower_body", "upper_body"]
  policy_obs_dim: -1
  critic_obs_dim: -1

  root_body_name: base_link
  pelvis_name: base_link
  torso_name: waist_yaw_link
  imu_body_name: imu_link
  qpos_root_dim: 7
  qvel_root_dim: 6

  key_bodies: ["left_ankle_roll_link", "right_ankle_roll_link"]
  contact_bodies: ["left_ankle_roll_link", "right_ankle_roll_link"]
  num_feet: 2
  right_foot_name: right_ankle_roll_link
  left_foot_name: left_ankle_roll_link
  foot_name: ankle_roll_link
  knee_name: knee_pitch_link
  has_torso: true
  has_upper_body_dof: true

  dof_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_pitch_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_pitch_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_pitch_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_pitch_joint

  lower_dof_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_pitch_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_pitch_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
  upper_dof_names:
    - waist_yaw_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_pitch_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_pitch_joint
  waist_dof_names: [waist_yaw_joint]
  waist_yaw_dof_name: waist_yaw_joint
  arm_dof_names:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_pitch_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_pitch_joint
  upper_left_arm_dof_names:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_pitch_joint
  upper_right_arm_dof_names:
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_pitch_joint
  left_arm_dof_names: ${robot.upper_left_arm_dof_names}
  right_arm_dof_names: ${robot.upper_right_arm_dof_names}
  left_ankle_dof_names: [left_ankle_pitch_joint, left_ankle_roll_joint]
  right_ankle_dof_names: [right_ankle_pitch_joint, right_ankle_roll_joint]
  knee_dof_names: [left_knee_pitch_joint, right_knee_pitch_joint]

  symmetric_dofs_idx:
    left_dofs_idx_no: [0, 3, 4, 13, 16]
    left_dofs_idx_op: [1, 2, 5, 14, 15]
    right_dofs_idx_no: [6, 9, 10, 17, 20]
    right_dofs_idx_op: [7, 8, 11, 18, 19]
    waist_dofs_idx_no: []
    waist_dofs_idx_op: [12]
    lower_left_dofs_idx_no: [0, 3, 4]
    lower_left_dofs_idx_op: [1, 2, 5]
    lower_right_dofs_idx_no: [6, 9, 10]
    lower_right_dofs_idx_op: [7, 8, 11]
    upper_left_dofs_idx_no: [1, 4]
    upper_left_dofs_idx_op: [2, 3]
    upper_right_dofs_idx_no: [5, 8]
    upper_right_dofs_idx_op: [6, 7]

  dof_pos_lower_limit_list:
    [-1.8326, -0.8727, -1.9199, -0.3491, -0.7, -0.518,
     -1.8326, -1.3963, -1.9199, -0.3491, -0.7, -0.518,
     -2.618,
     -3.4907, -0.1745, -1.5708, -0.576,
     -3.4907, -3.1416, -1.5708, -0.576]
  dof_pos_upper_limit_list:
    [1.8326, 1.3963, 1.9199, 1.9199, 0.7, 0.518,
     1.8326, 0.8727, 1.9199, 1.9199, 0.7, 0.518,
     2.618,
     1.0472, 3.1416, 1.5708, 3.8397,
     1.0472, 0.1745, 1.5708, 3.8397]
  dof_vel_limit_list:
    [10, 10, 10, 10, 45, 45, 10, 10, 10, 10, 45, 45, 10, 45, 45, 45, 45, 45, 45, 45, 45]
  dof_effort_limit_list:
    [27, 27, 27, 27, 25, 25, 27, 27, 27, 27, 25, 25, 27, 12.5, 12.5, 12.5, 12.5, 12.5, 12.5, 12.5, 12.5]
  dof_effort_limit_scale: 0.8
  dof_armature_list:
    [0.0459520668, 0.0459520668, 0.0459520668, 0.0459520668, 0.01, 0.01,
     0.0459520668, 0.0459520668, 0.0459520668, 0.0459520668, 0.01, 0.01,
     0.0459520668,
     0.0019, 0.0019, 0.0019, 0.0019, 0.0019, 0.0019, 0.0019, 0.0019]
  dof_joint_friction_list:
    [0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03,
     0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03, 0.03]

  body_names:
    - base_link
    - imu_link
    - left_hip_pitch_link
    - left_hip_roll_link
    - left_hip_yaw_link
    - left_knee_pitch_link
    - left_ankle_pitch_link
    - left_ankle_roll_link
    - right_hip_pitch_link
    - right_hip_roll_link
    - right_hip_yaw_link
    - right_knee_pitch_link
    - right_ankle_pitch_link
    - right_ankle_roll_link
    - waist_yaw_link
    - head_link
    - left_shoulder_pitch_link
    - left_shoulder_roll_link
    - left_shoulder_yaw_link
    - left_elbow_pitch_link
    - right_shoulder_pitch_link
    - right_shoulder_roll_link
    - right_shoulder_yaw_link
    - right_elbow_pitch_link
  render_body_names: ${robot.body_names}
  tracking_body_names: ${robot.body_names}

  terminate_after_contacts_on: [base_link, shoulder, hip]
  penalize_contacts_on: [base_link, shoulder, hip]
  randomize_link_body_names:
    - base_link
    - left_hip_pitch_link
    - left_hip_roll_link
    - left_hip_yaw_link
    - left_knee_pitch_link
    - right_hip_pitch_link
    - right_hip_roll_link
    - right_hip_yaw_link
    - right_knee_pitch_link

  init_state:
    pos: [0.0, 0.0, 0.47]
    rot: [0.0, 0.0, 0.0, 1.0]
    lin_vel: [0.0, 0.0, 0.0]
    ang_vel: [0.0, 0.0, 0.0]
    default_joint_angles:
      left_hip_pitch_joint: 0.0
      left_hip_roll_joint: 0.0
      left_hip_yaw_joint: 0.0
      left_knee_pitch_joint: 0.0
      left_ankle_pitch_joint: 0.0
      left_ankle_roll_joint: 0.0
      right_hip_pitch_joint: 0.0
      right_hip_roll_joint: 0.0
      right_hip_yaw_joint: 0.0
      right_knee_pitch_joint: 0.0
      right_ankle_pitch_joint: 0.0
      right_ankle_roll_joint: 0.0
      waist_yaw_joint: 0.0
      left_shoulder_pitch_joint: 0.0
      left_shoulder_roll_joint: 0.0
      left_shoulder_yaw_joint: 0.0
      left_elbow_pitch_joint: 0.0
      right_shoulder_pitch_joint: 0.0
      right_shoulder_roll_joint: 0.0
      right_shoulder_yaw_joint: 0.0
      right_elbow_pitch_joint: 0.0

  control:
    control_type: P
    stiffness:
      hip_pitch: 60.0
      hip_roll: 55.0
      hip_yaw: 25.0
      knee: 60.0
      ankle_pitch: 50.0
      ankle_roll: 45.0
      waist_yaw: 65.0
      shoulder_pitch: 30.0
      shoulder_roll: 25.0
      shoulder_yaw: 30.0
      elbow: 20.0
    damping:
      hip_pitch: 4.5
      hip_roll: 2.8
      hip_yaw: 1.1
      knee: 4.5
      ankle_pitch: 1.2
      ankle_roll: 1.2
      waist_yaw: 3.0
      shoulder_pitch: 1.0
      shoulder_roll: 2.0
      shoulder_yaw: 1.0
      elbow: 1.0
    action_scale: 0.25
    action_clip_value: 8.0
    action_rescale: false
    clip_torques: true
    normalize_action: true
    normalize_action_from: 1.0
    normalize_action_to: 8.0

  asset:
    collapse_fixed_joints: false
    replace_cylinder_with_capsule: true
    flip_visual_attachments: false
    armature: 0.001
    thickness: 0.01
    max_angular_velocity: 1000.0
    max_linear_velocity: 1000.0
    density: 0.001
    angular_damping: 0.0
    linear_damping: 0.0
    disable_gravity: false
    urdf_file: mini3/urdf/mini3.urdf
    usd_file: null
    xml_file: mini3/mjcf/scene.xml
    robot_type: mini3_21dof
    self_collisions: 0
    default_dof_drive_mode: 3
    fix_base_link: false

  motion:
    motion_file: data/lafan1_mini3
    max_len: 300
    quaternion_order: xyzw
    asset:
      assetRoot: humanoidverse/data/robots/mini3/
      assetFileName: mjcf/mini3.xml
      urdfFileName: urdf/mini3.urdf

    humanoid_type: mini3_21dof
    bias_offset: false
    has_self_collision: true
    has_mesh: true
    has_jt_limit: true
    has_dof_subset: true
    has_upright_start: true
    has_smpl_pd_offset: false
    remove_toe: false
    motion_sym_loss: false
    sym_loss_coef: 1
    big_ankle: false
    has_shape_obs: false
    has_shape_obs_disc: false
    has_shape_variation: false
    uniform_sample: false
    motion_fps_scale: 1.0
    standardize_motion_length: true
    standardize_motion_length_value: 10
    reverse_motion: false
    masterfoot: false
    freeze_toe: false
    freeze_hand: false
    box_body: true
    real_weight: true
    real_weight_porpotion_capsules: true
    real_weight_porpotion_boxes: true

    body_names: ${robot.body_names}
    tracking_body_names: ${robot.tracking_body_names}
    dof_names: ${robot.dof_names}
    nums_extend_bodies: 0
    extend_config: []
    motion_tracking_link: []

    lower_body_link:
      - base_link
      - imu_link
      - left_hip_pitch_link
      - left_hip_roll_link
      - left_hip_yaw_link
      - left_knee_pitch_link
      - left_ankle_pitch_link
      - left_ankle_roll_link
      - right_hip_pitch_link
      - right_hip_roll_link
      - right_hip_yaw_link
      - right_knee_pitch_link
      - right_ankle_pitch_link
      - right_ankle_roll_link
      - waist_yaw_link
    upper_body_link:
      - head_link
      - left_shoulder_pitch_link
      - left_shoulder_roll_link
      - left_shoulder_yaw_link
      - left_elbow_pitch_link
      - right_shoulder_pitch_link
      - right_shoulder_roll_link
      - right_shoulder_yaw_link
      - right_elbow_pitch_link

    pelvis_link: base_link
    base_link: waist_yaw_link
    hips_link:
      - left_hip_pitch_link
      - left_hip_roll_link
      - left_hip_yaw_link
      - right_hip_pitch_link
      - right_hip_roll_link
      - right_hip_yaw_link
    joint_matches:
      - [base_link, Pelvis]
      - [left_hip_pitch_link, L_Hip]
      - [left_knee_pitch_link, L_Knee]
      - [left_ankle_roll_link, L_Ankle]
      - [right_hip_pitch_link, R_Hip]
      - [right_knee_pitch_link, R_Knee]
      - [right_ankle_roll_link, R_Ankle]
      - [left_shoulder_roll_link, L_Shoulder]
      - [left_elbow_pitch_link, L_Elbow]
      - [right_shoulder_roll_link, R_Shoulder]
      - [right_elbow_pitch_link, R_Elbow]
      - [head_link, Head]
    smpl_pose_modifier:
      - Pelvis: "[np.pi/2, 0, np.pi/2]"
      - L_Shoulder: "[0, 0, -np.pi/2]"
      - R_Shoulder: "[0, 0, np.pi/2]"
      - L_Elbow: "[0, -np.pi/2, 0]"
      - R_Elbow: "[0, np.pi/2, 0]"

    visualization:
      customize_color: true
      marker_joint_colors:
